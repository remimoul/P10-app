services:
  frontend:
    build:
      context: .
      dockerfile: ./docker/front/Dockerfile.prod
    container_name: frontend2_P10
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4500
    ports:
      - "3000:3000"
  backend:
    build:
      context: .
      dockerfile: ./docker/back/Dockerfile.prod
    container_name: backend2_P10
    environment:
      DATABASE_URL: postgresql://f10db_owner:${PASSWORD_NEON}@ep-winter-night-a55b4nyo-pooler.us-east-2.aws.neon.tech:5432/f10db
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_SIGNING_KEY: ${CLERK_SIGNING_KEY}
      PORT: 4500
      CORS_FRONTEND_URL: http://localhost:3000
    restart: always
    ports:
      - "4500:4500"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_p10_prod
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=:9090"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: always
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_p10_prod
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_SERVER_HTTP_PORT=3005
    ports:
      - "3005:3005"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
